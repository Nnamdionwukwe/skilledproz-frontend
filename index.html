<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/skilledproz.PNG" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SkilledProz",
        "url": "https://www.skilledproz.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.skilledproz.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "publisher": {
          "@type": "Organization",
          "name": "SkilledProz",
          "logo": "https://www.skilledproz.com/skilledproz.PNG"
        }
      }
    </script>
    <meta
      name="google-site-verification"
      content="9SuQWUxZ6X8_d3J3luJVNgBZ5QuttoPcsakxu1ZYWB0"
    />
    <link rel="icon" type="image/svg+xml" href="skilledproz.PNG" />
    <meta name="theme-color" content="#080810" />
    <title>SkilledProz - Find Jobs, Hire Talent & Post Jobs in Nigeria</title>
    <meta
      name="description"
      content="SkilledProz is Nigeria's premier marketplace to find jobs, hire skilled professionals, and post job openings in Abuja, Lagos, and across Nigeria. Connect with top talent or find your next opportunity today."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hide every piece of Google Translate UI */
      .goog-te-banner-frame,
      .goog-te-menu-frame,
      .goog-te-balloon-frame,
      .goog-te-gadget,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe,
      .skiptranslate,
      #google_translate_element,
      iframe.skiptranslate {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        overflow: hidden !important;
      }
      body {
        top: 0 !important;
        position: static !important;
        overflow-x: hidden;
      }
      html {
        overflow-x: hidden;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      /* Prevent iOS zoom */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    </style>

    <!-- Prevent GT from shifting body down — runs synchronously before GT loads -->
    <script>
      (function () {
        function fix() {
          if (
            document.body &&
            document.body.style.top &&
            document.body.style.top !== "0px"
          ) {
            document.body.style.top = "0px";
          }
        }
        setInterval(fix, 100);
        document.addEventListener("DOMContentLoaded", fix);
      })();
    </script>
  </head>
  <body>
    <!-- GT initialises here, reads the googtrans cookie automatically -->
    <div
      id="google_translate_element"
      style="display: none; height: 0; overflow: hidden"
    ></div>
    <script>
      function googleTranslateElementInit() {
        try {
          new google.translate.TranslateElement(
            { pageLanguage: "en", autoDisplay: false },
            "google_translate_element",
          );
        } catch (e) {}
      }
    </script>
    <script
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
      defer
    ></script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
